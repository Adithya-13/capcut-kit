[project]
name = "capcut-kit"
version = "0.1.0"
description = "Read, edit, and generate CapCut desktop projects from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
]

[project.scripts]
capcut = "capcut_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capcut_kit"]
